services:
  # --- BACKEND (Laravel API) ---
  - type: web
    name: greentech-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        fromService:
          type: web
          name: greentech-backend
          property: host

      - key: APP_KEY
        generateValue: true

      # PostgreSQL Render
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_URL
        fromDatabase:
          name: greentech-db
          property: connectionString

      - key: DATABASE_URL
        fromDatabase:
          name: greentech-db
          property: connectionString

      # Session API
      - key: SESSION_DRIVER
        value: array

      # Logs Render
      - key: LOG_CHANNEL
        value: stderr

      # Images (le disque Render est effacé à chaque redémarrage)
      # Valeur à saisir dans le tableau de bord Render : cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false

# --- DATABASE (PostgreSQL) ---
databases:
  - name: greentech-db
    databaseName: greentech_db
    user: greentech_user
    plan: free
    region: frankfurt