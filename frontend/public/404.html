<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>GREEN TECHNOLOGIES BTP</title>
    <script>
      // Single Page App redirect for static hosts (Render, GitHub Pages, etc.)
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.setItem('spa_redirect_path', path + search + hash);
      window.location.replace('/');
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px; background: #020617; color: #94a3b8;">
    <p>Redirection en cours vers l'application...</p>
  </body>
</html>
