services:
  # --- BACKEND (Laravel API) ---
  - type: web
    name: greentech-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: greentech-backend
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: greentech-db
          property: connectionString
      - key: APP_KEY
        generateValue: true

# --- DATABASE (PostgreSQL) ---
databases:
  - name: greentech-db
    databaseName: greentech_db
    user: greentech_user
    plan: free
    region: frankfurt
